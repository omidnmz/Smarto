# Deploys to Liara after every push to main, once LIARA_API_TOKEN is set in the repo's secrets.
name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Liara is connected
        id: check
        run: echo "ready=${{ secrets.LIARA_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx -y @liara/cli@latest deploy --api-token "${{ secrets.LIARA_API_TOKEN }}" --detach
